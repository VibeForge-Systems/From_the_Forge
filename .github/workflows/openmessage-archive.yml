# ============================================================================
# OpenMessage Archive — CI
#
# Lives at the repository root because GitHub only runs workflows from
# .github/workflows/; it is scoped to Apps/openmessage-archive/ by path filters.
#
#   checks   Linux: npm license audit, typecheck, unit tests, rustfmt,
#            clippy (also with oma-archive's optional, never-shipped `heic`
#            feature), Rust tests, the independent Python oracles (M6),
#            IPC bindings drift, cargo-deny.
#   build    Linux + Windows: Rust and frontend tests on the target OS, then
#            unsigned installers uploaded as workflow artifacts.
#
# Actions are pinned to commit SHAs (tag in the trailing comment). The Rust
# toolchain comes from Apps/openmessage-archive/rust-toolchain.toml via rustup.
# ============================================================================
name: OpenMessage Archive

on:
  push:
    branches: [main]
    paths:
      - "Apps/openmessage-archive/**"
      - ".github/workflows/openmessage-archive.yml"
  pull_request:
    paths:
      - "Apps/openmessage-archive/**"
      - ".github/workflows/openmessage-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oma-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Apps/openmessage-archive
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Building on the oldest supported Ubuntu keeps the glibc floor low for
  # the .deb and AppImage. See docs/compatibility.md.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/openmessage-archive/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Apps/openmessage-archive

      - run: npm ci
      - name: JavaScript license audit
        run: npm run licenses
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npx vite build

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Owner decision Q2 (M5): the optional `heic` feature is never enabled in
      # a shipped or CI release build; it is only linted here (tests included)
      # and audited below, so it does not rot.
      - name: clippy (optional heic feature, never shipped)
        run: cargo clippy -p oma-archive --all-targets --locked --features heic -- -D warnings
      - name: Rust tests (also regenerates IPC bindings)
        run: cargo test --workspace --locked
      # M6 spec §14.4: the independent oracles, Linux only. The Rust import
      # writes one archive per catalogue entry; Python (isolated mode, a
      # virtual environment, hashes enforced, wheels only) projects each
      # with stdlib sqlite3 and checks it against the generators' models.
      - name: Independent oracles (Python)
        run: |
          python3 --version
          python3 -I -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          python3 -m venv "$RUNNER_TEMP/venv-oracles"
          "$RUNNER_TEMP/venv-oracles/bin/pip" install --require-hashes --only-binary :all: --no-deps \
            -r scripts/oracles/requirements.txt
          out="$RUNNER_TEMP/oracle-archives"
          OMA_ORACLE_OUT="$out" cargo test -p oma-archive --locked --test export_fixtures -- \
            --ignored --exact write_oracle_archives
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/run_oracles.py --archives "$out"
          # Slice 6e2: every catalogue entry exported to TXT through the
          # pipeline, parsed back with the line grammar and compared with
          # its archive; each bundle's SHA256SUMS also with coreutils.
          txt="$RUNNER_TEMP/oracle-txt"
          OMA_ORACLE_TXT_OUT="$txt" cargo test -p oma-export --locked --test txt -- \
            --ignored --exact write_oracle_txt
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/txt_grammar.py --exports "$txt"
          for b in "$txt"/*/export/*/; do (cd "$b" && sha256sum --quiet -c SHA256SUMS); done
          # Slice 6f: every catalogue entry exported to JSON + CSV (with and
          # without the identifier opt-in, both CSV profiles) and to JSON in
          # four fixed zones; the JSON is checked against the projection and
          # both schemas, the CSV against the JSON, the zones with zoneinfo.
          data="$RUNNER_TEMP/oracle-data"
          OMA_ORACLE_DATA_OUT="$data" cargo test -p oma-export --locked --test json -- \
            --ignored --exact write_oracle_data
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/data_oracle.py --exports "$data"
          for b in "$data"/*/ids/*/ "$data"/*/ordinals/*/ "$data"/*/zone-*/*/; do
            (cd "$b" && sha256sum --quiet -c SHA256SUMS)
          done
          # Slice 6g: every catalogue entry exported to HTML + JSON twice
          # (files copied with the test's preview renditions and markers
          # on; names only and markers off); every page is read with
          # html.parser and html5lib (strict) and compared with the JSON.
          html="$RUNNER_TEMP/oracle-html"
          OMA_ORACLE_HTML_OUT="$html" cargo test -p oma-export --locked --test html -- \
            --ignored --exact write_oracle_html
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/html_oracle.py --exports "$html"
          for b in "$html"/*/files/*/ "$html"/*/names/*/; do (cd "$b" && sha256sum --quiet -c SHA256SUMS); done
          # Slice 6j1: sample PDFs from the export-render helper's PDF
          # backend (every bundled script, emoji, undrawable characters,
          # the hidden-character markers on and off, a hostile corpus),
          # read back with pypdf and poppler's pdftotext (an external
          # program, GPL; nothing of it is copied or shipped).
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdftotext -v
          pdf="$RUNNER_TEMP/oracle-pdf"
          mkdir -p "$pdf"
          OMA_PDF_SAMPLES="$pdf" cargo test -p oma-export --locked --test pdf_layout -- \
            --ignored --exact write_samples
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/pdf_text.py --samples "$pdf"
          # Slice 6j2: every catalogue entry exported to JSON + PDF through
          # the pipeline (the PDF backend in-process), read back with pypdf
          # and pdftotext and checked against the bundle's JSON: volumes,
          # titles, tags, embedded fonts, constructs that are never
          # present, every item in order and exactly once (also across
          # volumes cut at 2 pages), masking sentinels and the revealed
          # positive control.
          pdfx="$RUNNER_TEMP/oracle-pdf-exports"
          OMA_ORACLE_PDF_OUT="$pdfx" cargo test -p oma-export --locked --test pdf_writer -- \
            --ignored --exact write_oracle_pdf
          "$RUNNER_TEMP/venv-oracles/bin/python" -I scripts/oracles/pdf_oracle.py --exports "$pdfx"
          for b in "$pdfx"/*/files/*/ "$pdfx"/*/names/*/ "$pdfx"/*/cut/*/; do (cd "$b" && sha256sum --quiet -c SHA256SUMS); done
      - name: IPC bindings are up to date
        run: |
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::src/types/generated is stale. Run 'cargo test' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- src/types/generated)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated bindings are not committed: $untracked"
            exit 1
          fi

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Rust license and advisory audit
        run: cargo deny --locked check
      - name: Rust license and advisory audit (optional heic feature)
        run: cargo deny --locked --features oma-archive/heic check

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/openmessage-archive/package-lock.json

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Apps/openmessage-archive

      - run: npm ci
      - name: Frontend tests
        run: npm test
      # cfg(windows) code (oma-backup's guards, staging and Windows-only
      # tests) is never compiled by the Linux clippy step.
      - name: clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Path handling differs by platform (separators, drive prefixes,
      # verbatim paths, reserved names), so the Rust suite runs on each OS.
      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build installers
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmessage-archive-${{ runner.os }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            Apps/openmessage-archive/target/release/bundle/deb/*.deb
            Apps/openmessage-archive/target/release/bundle/rpm/*.rpm
            Apps/openmessage-archive/target/release/bundle/appimage/*.AppImage
            Apps/openmessage-archive/target/release/bundle/nsis/*.exe
            Apps/openmessage-archive/target/release/bundle/msi/*.msi
