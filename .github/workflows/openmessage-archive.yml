# ============================================================================
# OpenMessage Archive — CI
#
# Lives at the repository root because GitHub only runs workflows from
# .github/workflows/; it is scoped to Apps/openmessage-archive/ by path filters.
#
#   checks   Linux: npm license audit, typecheck, unit tests, rustfmt,
#            clippy (also with oma-archive's optional, never-shipped `heic`
#            feature), Rust tests, IPC bindings drift, cargo-deny.
#   build    Linux + Windows: Rust and frontend tests on the target OS, then
#            unsigned installers uploaded as workflow artifacts.
#
# Actions are pinned to commit SHAs (tag in the trailing comment). The Rust
# toolchain comes from Apps/openmessage-archive/rust-toolchain.toml via rustup.
# ============================================================================
name: OpenMessage Archive

on:
  push:
    branches: [main]
    paths:
      - "Apps/openmessage-archive/**"
      - ".github/workflows/openmessage-archive.yml"
  pull_request:
    paths:
      - "Apps/openmessage-archive/**"
      - ".github/workflows/openmessage-archive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oma-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Apps/openmessage-archive
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Building on the oldest supported Ubuntu keeps the glibc floor low for
  # the .deb and AppImage. See docs/compatibility.md.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libxdo-dev libssl-dev
    libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/openmessage-archive/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Apps/openmessage-archive

      - run: npm ci
      - name: JavaScript license audit
        run: npm run licenses
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm test
      - name: Frontend build
        run: npx vite build

      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Owner decision Q2 (M5): the optional `heic` feature is never enabled in
      # a shipped or CI release build; it is only linted here (tests included)
      # and audited below, so it does not rot.
      - name: clippy (optional heic feature, never shipped)
        run: cargo clippy -p oma-archive --all-targets --locked --features heic -- -D warnings
      - name: Rust tests (also regenerates IPC bindings)
        run: cargo test --workspace --locked
      - name: IPC bindings are up to date
        run: |
          if ! git diff --exit-code -- src/types/generated; then
            echo "::error::src/types/generated is stale. Run 'cargo test' and commit the result."
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard -- src/types/generated)"
          if [ -n "$untracked" ]; then
            echo "::error::New generated bindings are not committed: $untracked"
            exit 1
          fi

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Rust license and advisory audit
        run: cargo deny --locked check
      - name: Rust license and advisory audit (optional heic feature)
        run: cargo deny --locked --features oma-archive/heic check

  build:
    name: Build (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - name: Windows
            os: windows-2022
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/openmessage-archive/package-lock.json

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS

      - name: Install Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: Apps/openmessage-archive

      - run: npm ci
      - name: Frontend tests
        run: npm test
      # cfg(windows) code (oma-backup's guards, staging and Windows-only
      # tests) is never compiled by the Linux clippy step.
      - name: clippy (Windows)
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Path handling differs by platform (separators, drive prefixes,
      # verbatim paths, reserved names), so the Rust suite runs on each OS.
      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build installers
        run: npx tauri build --ci --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmessage-archive-${{ runner.os }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            Apps/openmessage-archive/target/release/bundle/deb/*.deb
            Apps/openmessage-archive/target/release/bundle/rpm/*.rpm
            Apps/openmessage-archive/target/release/bundle/appimage/*.AppImage
            Apps/openmessage-archive/target/release/bundle/nsis/*.exe
            Apps/openmessage-archive/target/release/bundle/msi/*.msi
