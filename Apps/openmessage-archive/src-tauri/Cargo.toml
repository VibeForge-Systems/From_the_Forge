[package]
name = "openmessage-archive"
description = "OpenMessage Archive — a local-first desktop archive for iPhone Messages backups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
default-run = "openmessage-archive"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows, where a
# lib and bin with the same name produce colliding .pdb files.
name = "openmessage_archive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
dunce.workspace = true
getrandom.workspace = true
oma-archive.workspace = true
oma-backup.workspace = true
oma-fs.workspace = true
oma-messages.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
