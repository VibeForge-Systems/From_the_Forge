# OpenMessage Archive — Cargo workspace.
#
# Every Rust component is a workspace member so that the backup, extraction,
# storage and export libraries can be built and tested without the desktop
# shell. The Tauri application in src-tauri/ is a thin integration layer over
# these crates; business logic does not live there.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/VibeForge-Systems/From_the_Forge"
authors = ["VibeForge Systems, Inc. and OpenMessage Archive contributors"]

# Versions are pinned exactly (`=`) so a fresh lockfile cannot silently move a
# dependency. Upgrades are deliberate edits, recorded in docs/dependencies.md.
[workspace.dependencies]
dunce = "=1.0.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }
ts-rs = "=12.0.1"

# Milestone 2: backup parsing and decryption (crates/oma-backup).
# Every feature set below is the minimum the crate uses; see docs/dependencies.md.
aes = { version = "=0.9.3", features = ["zeroize"] }
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
cbc = { version = "=0.2.1", features = ["block-padding", "zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] } # dev-dependency only: differential tests
# The event-stream API (`plist::stream`) that the budgeted reader needs is behind
# this feature. The exact pin makes every upgrade a reviewed change.
plist = { version = "=1.10.1", default-features = false, features = ["enable_unstable_features_that_may_break_with_minor_version_bumps"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "hooks"] }
sha1 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", features = ["derive", "std"] }

tauri = "=2.12.4"
tauri-build = "=2.7.3"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"

# Milestone 4: volume facts and durable placement (crates/oma-fs).
# fs4: free space only, so its default `sync` feature (file locking) is off.
# rustix: Linux only, for statfs, renameat2(RENAME_NOREPLACE), O_NOFOLLOW
# opens and geteuid; `std` is its default and stays on.
fs4 = { version = "=1.1.0", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }

# Milestone 5: images. A dependency of oma-archive from slice 5d
# (`media::render`, run only inside the decode helper process), and of its
# fixture generator `make_viewer_media`. Only the four decoders/encoders M5 serves:
# no `avif` (an encoder through ravif, not needed) and no `avif-native`
# (the decoder: MPL-2.0 `mp4parse` and C `dav1d`); no TIFF, EXR or rayon.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# Owner decision Q2 (M5): an optional HEIC decoder behind oma-archive's `heic`
# feature, OFF by default and never enabled in official or CI release
# builds (HEVC is pooled-patent technology; see docs/privacy.md). Pure Rust,
# `forbid(unsafe_code)`, MIT OR Apache-2.0; without its default `parallel`
# feature it has no dependencies at all.
heic-rs = { version = "=0.1.4", default-features = false, features = ["std"] }

# Milestone 5: media tokens in the shell (src-tauri/src/viewer/media/tokens.rs):
# 128 random bits from the OS. Already in the lockfile through Tauri; default
# features only (no `wasm_js`, no custom backend).
getrandom = "=0.3.4"

# Milestone 6 slice 6f: the CSV writer (crates/oma-export/src/writer/csv.rs),
# used only through `Writer::from_writer` over a staged file (spec §5.2,
# D130). Unlicense OR MIT; its dependencies csv-core, itoa and ryu are
# permissive too (docs/dependencies.md).
csv = "=1.4.0"

# Milestone 6 slice 6i: the main process's check on PDF output from the
# export-render helper inflates every FlateDecode stream
# (crates/oma-export/src/check/pdf.rs, spec §5.7). Already locked through
# png (image, Tauri); MIT OR Zlib OR Apache-2.0. `with-alloc` (the
# `decompress_to_vec_zlib_with_limit` API) only: no `std`, no `simd`.
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }

oma-fs = { path = "crates/oma-fs" }
oma-backup = { path = "crates/oma-backup" }
oma-messages = { path = "crates/oma-messages" }
oma-archive = { path = "crates/oma-archive" }
oma-export = { path = "crates/oma-export" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Debug-build crypto would make the key-derivation tests slow and
# timing-sensitive, so these crates are optimized even in dev and test builds.
[profile.dev.package.sha1]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.oma-backup]
opt-level = 3
# The bundled SQLite C build: Cargo passes this profile's OPT_LEVEL to `cc`.
# The M3 checks run whole-database passes and integrity checks in tests.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.oma-messages]
opt-level = 3
[profile.dev.package.oma-archive]
opt-level = 3
# Slice 6f: the export writers stream every record of a job through
# serde_json (its generic serialisation is instantiated in oma-export) and
# csv; the perf smoke test exports 20,000 messages on every push, so the
# writer crates are optimized in tests too.
[profile.dev.package.oma-export]
opt-level = 3
[profile.dev.package.csv]
opt-level = 3
[profile.dev.package.csv-core]
opt-level = 3
