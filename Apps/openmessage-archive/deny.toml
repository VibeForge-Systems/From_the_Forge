# cargo-deny policy: licenses, advisories, and sources for every Rust crate
# that ends up in the binary. Run with `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Audit what ships on the supported platforms, not every target a crate
# happens to support.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
all-features = false

[licenses]
# Permissive licenses only in the global list. Copyleft (GPL, LGPL, AGPL,
# MPL) is not on it: the project is Apache-2.0 and must remain
# redistributable as such. The only copyleft is the per-crate MPL-2.0
# exceptions below.
# Adding a license here is a reviewed decision recorded in docs/dependencies.md.
# Entries are added when a dependency actually needs them, so an unused
# allowance cannot quietly widen the policy.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-3-Clause",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.9

# MPL-2.0 is file-level copyleft: MPL-covered files may be combined into an
# Apache-2.0 work (MPL-2.0 §3.3), provided their source stays available
# (it is, unmodified, on crates.io). These crates arrive through Tauri itself
# (tauri-utils -> dom_query -> cssparser/selectors; dirs-sys -> option-ext)
# and cannot be avoided without leaving Tauri. They are excepted by name, so
# any NEW MPL dependency still fails this check and needs a reviewed decision.
# See docs/dependencies.md.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[advisories]
# Unmaintained-crate notices fail only for crates this workspace depends on
# directly. Transitive notices (for example the GTK3 bindings under Tauri's
# Linux backend) cannot be fixed downstream; they are tracked with Tauri
# upgrades rather than blocking every build. Vulnerabilities fail at any depth.
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
