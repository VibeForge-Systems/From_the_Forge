[package]
name = "oma-archive"
description = "The archive library of OpenMessage Archive: archive creation, locking, a hardened SQLite opener, schema v1 with a fingerprint check, and forward-only migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
# Test hooks (spec D85): a simulated lock self-test failure, test-only schema
# plans with a v1 -> v2 migration, and a skewed expected shadow-table DDL.
# Never enabled by a shipped build; only this crate's own tests turn it on,
# through the self dev-dependency below.
fault-injection = []

[dependencies]
oma-backup.workspace = true
oma-fs.workspace = true
rusqlite.workspace = true
sha2.workspace = true
thiserror.workspace = true
dunce.workspace = true
tracing.workspace = true

[dev-dependencies]
oma-archive = { path = ".", features = ["fault-injection"] }
tempfile.workspace = true
tracing-subscriber.workspace = true # log-hygiene test

[lints]
workspace = true
