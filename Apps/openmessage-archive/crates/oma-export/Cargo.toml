[package]
name = "oma-export"
description = "The export engine of OpenMessage Archive: the canonical export record, its code registry and column ledger, export-local identifiers, time zones, and text safety for every output format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Tauri-free, and never names `rusqlite` in its own code (M6 spec §4.1,
# D123): every archive read goes through `oma-archive`'s public export
# APIs. `tests/source_rules.rs` enforces both.
[dependencies]
csv.workspace = true # the CSV writer, through `Writer::from_writer` only (§5.2, D130)
dunce.workspace = true # the destination is checked in its canonical form (§8.2, D143)
getrandom.workspace = true # 128-bit export and staging ids (§7.1, §8.3)
miniz_oxide.workspace = true # inflates PDF streams in the helper output check (§5.7)
oma-archive.workspace = true
oma-fs.workspace = true # sanitize_filename_max, create_new_private, placement (§6.2, §8)
serde.workspace = true
serde_json.workspace = true # the record's serde form is the JSON format (§4.2)
sha2.workspace = true # SHA256SUMS and the manifest's `files` (§7.2)
thiserror.workspace = true

# Linux only: every staged write is relative to O_DIRECTORY | O_NOFOLLOW
# handles (openat, mkdirat, renameat2, unlinkat; spec §8.3, D143).
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace = true

[features]
# Crash points (`fault::point`), compiled to nothing without the feature.
# Only this crate's own tests enable it (the self dev-dependency below).
fault-injection = []
# The export-render helper's own side (`render::serve` and its backends;
# spec §4.1, §5.7). Enabled only by the shell, whose `--oma-export-helper`
# entry is the only caller (this crate's source rules check it; the
# shell's `tests/export_helper.rs` drives it as a process).
render = []

[dev-dependencies]
oma-export = { path = ".", features = ["fault-injection", "render"] }
# Tests only: the archive's bulk generator (`hooks::bulk_writer`) for the
# ignored attachment throughput test (`tests/perf_attach.rs`).
oma-archive = { workspace = true, features = ["fault-injection"] }
oma-messages.workspace = true # what that generator's shared test module names
oma-backup.workspace = true # tests import the synthetic catalogues
tempfile.workspace = true
# Tests only: applying the export catalogue's `patches` (codes an import
# cannot write) to a test's own archive copy, as oma-archive's tests do.
rusqlite.workspace = true

[lints]
workspace = true
