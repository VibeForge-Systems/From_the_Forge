# =============================================================================
# Catalog — supply chain and security
# =============================================================================
# These are the checks most often sold as a paid add-on: secret scanning, static
# analysis, dependency review, license policy, SBOM. Every one of them is an
# open-source tool that runs on a laptop. What the add-on sells is the
# integration, not the capability.
#
# Copy a block into .vibeforge/gates.yaml and adjust. Version pins below are
# starting points — check for a newer release, pin deliberately, and treat a
# bump as a reviewable one-line commit.
#
# Read the `why:` before adopting one. A check nobody can justify is a check
# that gets disabled the first time it is inconvenient.
# =============================================================================

checks:

  # --- secret scanning ------------------------------------------------------
  #
  # Four scopes, because "no secrets" means different things at different
  # moments, and the one that matters at push time is the one most gates skip:
  #
  #   secret-scan-staged    commit  what this commit adds
  #   secret-scan-outgoing  push    EVERY commit this push publishes, including
  #                                 merge resolutions and commit messages
  #   secret-scan           push    the working tree (also untracked files)
  #   secret-scan-history   manual  every ref, all of history
  #
  # A tree scan alone is the classic slip: a value committed in one commit and
  # deleted in the next leaves a clean tree and a published credential. So is a
  # history scan alone — `git log -p` prints no diff for a merge, so a value
  # introduced while resolving a conflict is invisible to it (demonstrated
  # against gitleaks 8.30.1 and TruffleHog 3.99.3). The outgoing and
  # history checks add a --remerge-diff pass for exactly that.
  #
  # gitleaks >= 8.19 replaced `detect`/`protect` with `git`, `dir` and `stdin`;
  # the old commands still run but are hidden and deprecated. With no
  # --log-opts, `gitleaks git` walks `--full-history --all`; passing --log-opts
  # REPLACES those defaults rather than adding to them.

  - id: secret-scan-staged
    desc: no credential values in what this commit adds
    stage: commit
    tool: gitleaks
    tool_version: "8.30.1"
    version_cmd: gitleaks version
    install: "go install github.com/gitleaks/gitleaks/v8@v8.30.1"
    fetch_sha256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
    why: |
      The cheapest moment to stop a credential is before it is a commit at all:
      once committed, removing it means rewriting history, and once pushed, it
      means rotating it. `--pre-commit --staged` scans exactly the staged diff,
      so it is fast enough for every commit. Keys on the shape and entropy of
      credential values, not identifier names. Allowlist synthetic test vectors
      in .gitleaks.toml (gitleaks loads <repo>/.gitleaks.toml on its own) rather
      than loosening a rule: an allowlist entry is reviewable, a loosened rule
      is not.
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/gitleaks/gitleaks/releases/download/v${VF_TOOL_VERSION}/gitleaks_${VF_TOOL_VERSION}_linux_x64.tar.gz" \
        -o "$d/gl.tgz"
      tar xzf "$d/gl.tgz" -C "$d" gitleaks
      mv "$d/gitleaks" "$VF_TOOL_DEST"
      rm -rf "$d"
    run: |
      "$VF_TOOL" git --pre-commit --staged --redact --no-banner "$VF_ROOT"

  - id: secret-scan-outgoing
    desc: no credential values in any commit this push would publish
    stage: push
    tool: gitleaks
    tool_version: "8.30.1"
    version_cmd: gitleaks version
    install: "go install github.com/gitleaks/gitleaks/v8@v8.30.1"
    fetch_sha256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
    why: |
      This is the check that matches what a push actually does. $VF_OUTGOING is
      every commit the destination does not have yet — computed by the runner
      from the refs git hands the pre-push hook, so `git push origin topic` is
      gated on topic, not on whatever is checked out. Three passes over those
      commits: their diffs; each merge replayed with --remerge-diff (git 2.36+,
      --cc before), because no history scanner reads merge resolutions; and
      their messages, which are not diffs. A finding here means the value is
      about to become public: rotate it first, then rewrite the commit.
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/gitleaks/gitleaks/releases/download/v${VF_TOOL_VERSION}/gitleaks_${VF_TOOL_VERSION}_linux_x64.tar.gz" \
        -o "$d/gl.tgz"
      tar xzf "$d/gl.tgz" -C "$d" gitleaks
      mv "$d/gitleaks" "$VF_TOOL_DEST"
      rm -rf "$d"
    run: |
      n="$(wc -l < "$VF_OUTGOING" | tr -d ' ')"
      [ "$n" -gt 0 ] || { echo "no outgoing commits"; exit 0; }
      w="$(mktemp -d)"; trap 'rm -rf "$w"' EXIT
      bad=0
      # 1. diffs. gitleaks splits --log-opts on single spaces into git log
      #    arguments, so the SHAs go in as one space-joined string, chunked.
      split -l 1000 "$VF_OUTGOING" "$w/chunk."
      for c in "$w"/chunk.*; do
        "$VF_TOOL" git --redact --no-banner \
          --log-opts "--no-walk $(paste -sd' ' "$c")" "$VF_ROOT" || bad=1
      done
      # 2. merge resolutions
      md=--remerge-diff
      git show --remerge-diff -s --format= HEAD >/dev/null 2>&1 || md=--cc
      while read -r c; do
        [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 2 ] || continue
        printf '=== merge %s\n' "$c"; git show "$md" -p --no-color --format= "$c"
      done < "$VF_OUTGOING" > "$w/merges"
      if [ -s "$w/merges" ]; then
        "$VF_TOOL" stdin --redact --no-banner < "$w/merges" || { echo "in a merge resolution (see the === merge lines)"; bad=1; }
      fi
      # 3. commit messages
      git log --no-walk=unsorted --stdin --format='=== commit %H%n%B' < "$VF_OUTGOING" > "$w/messages"
      "$VF_TOOL" stdin --redact --no-banner < "$w/messages" || { echo "in a commit message"; bad=1; }
      if [ "$bad" -ne 0 ]; then
        echo "a credential is in a commit this push would publish: rotate it, then rewrite the commit"
        exit 1
      fi
      echo "no credentials in $n outgoing commit(s), their merge resolutions, or their messages"

  - id: secret-scan
    desc: no credential values in the working tree
    stage: push
    tool: gitleaks
    tool_version: "8.30.1"
    version_cmd: gitleaks version
    install: "go install github.com/gitleaks/gitleaks/v8@v8.30.1"
    fetch_sha256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
    why: |
      The tree as it is now, untracked files included — so it also catches a
      credential sitting in a file that is about to be added. It cannot see a
      value that was committed and then deleted, which is still published and
      still live; secret-scan-outgoing covers that, and is the one to keep if
      you keep only one. Pin the scanner: a ruleset that updates silently can
      fail a build with no diff, or stop catching something.
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/gitleaks/gitleaks/releases/download/v${VF_TOOL_VERSION}/gitleaks_${VF_TOOL_VERSION}_linux_x64.tar.gz" \
        -o "$d/gl.tgz"
      tar xzf "$d/gl.tgz" -C "$d" gitleaks
      mv "$d/gitleaks" "$VF_TOOL_DEST"
      rm -rf "$d"
    run: |
      "$VF_TOOL" dir --redact --no-banner "$VF_ROOT"

  - id: secret-scan-history
    desc: no credential values anywhere in git history, on any ref
    stage: manual
    tool: gitleaks
    tool_version: "8.30.1"
    version_cmd: gitleaks version
    install: "go install github.com/gitleaks/gitleaks/v8@v8.30.1"
    fetch_sha256: "88f91962aa2f93ac6ab281d553b9e125f5197bbbce38f9f2437f7299c32e5509"
    why: |
      Every ref, every commit: what an attacker cloning the repo gets. Run it
      when adopting the gate, after any incident, and before a repository is
      made public (for that, the repo-publication-readiness skill goes further:
      a mirror clone, so refs/pull/* are included, and a second scanner). No
      --log-opts on purpose: gitleaks' default is `--full-history --all`, and
      any --log-opts value would replace it. Merges and messages get their own
      passes, as in secret-scan-outgoing. Slow on a large history, hence manual.
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/gitleaks/gitleaks/releases/download/v${VF_TOOL_VERSION}/gitleaks_${VF_TOOL_VERSION}_linux_x64.tar.gz" \
        -o "$d/gl.tgz"
      tar xzf "$d/gl.tgz" -C "$d" gitleaks
      mv "$d/gitleaks" "$VF_TOOL_DEST"
      rm -rf "$d"
    run: |
      w="$(mktemp -d)"; trap 'rm -rf "$w"' EXIT
      bad=0
      "$VF_TOOL" git --redact --no-banner "$VF_ROOT" || bad=1
      md=--remerge-diff
      git show --remerge-diff -s --format= HEAD >/dev/null 2>&1 || md=--cc
      git rev-list --merges --all | while read -r c; do
        printf '=== merge %s\n' "$c"; git show "$md" -p --no-color --format= "$c"
      done > "$w/merges"
      if [ -s "$w/merges" ]; then "$VF_TOOL" stdin --redact --no-banner < "$w/merges" || bad=1; fi
      { git log --all --format='=== commit %H%n%B'
        git for-each-ref refs/tags --format='=== tag %(refname)%0a%(contents)'; } > "$w/messages"
      "$VF_TOOL" stdin --redact --no-banner < "$w/messages" || bad=1
      [ "$bad" -eq 0 ] || { echo "credentials in history: rotate every one, then see the repo-publication-readiness skill"; exit 1; }
      echo "no credentials in any ref's history, merge resolutions or messages"

  # --- what else a push publishes -------------------------------------------
  #
  # Secret scanners find credentials. A public repository leaks other things a
  # credential scanner is not built to see: who committed it, where it was
  # built, whose work it was. These read $VF_OUTGOING, so they judge what is
  # being published, and they need nothing but bash, grep and git.

  - id: identity-check
    desc: every identity in the outgoing commits may be published
    stage: push
    probe: test -r .vibeforge/allowed-identities
    install: "create .vibeforge/allowed-identities: one extended regex per line, e.g. @users\.noreply\.github\.com$"
    why: |
      An author, committer, tagger or Co-authored-by email is published with the
      commit and can never be taken back without rewriting history. The usual
      accident is a commit made with an employer or client address on a
      machine configured for work. GitHub's "block command line pushes that
      expose my email" setting checks only the most recent commit of a push,
      and only your own private address; this checks every outgoing commit
      against the identities you decided may be public. The file holds
      patterns for identities that are ALREADY public, so it publishes nothing.
    run: |
      allowed() { grep -qiE -f <(grep -vE '^[[:space:]]*(#|$)' .vibeforge/allowed-identities) <<<"$1"; }
      bad=0
      while read -r e; do
        [ -n "$e" ] || continue
        allowed "$e" || { echo "   not in .vibeforge/allowed-identities: $e"; bad=1; }
      done < <(
        while read -r c; do
          git show -s --format='%ae%n%ce%n%(trailers:only,unfold)' "$c"
        done < "$VF_OUTGOING" | grep -oE '[^<> :]+@[^<> ]+\.[A-Za-z]{2,}' | sort -u
        while read -r t; do
          [ "$(git cat-file -t "$t" 2>/dev/null)" = tag ] && git cat-file -p "$t" | sed -n 's/^tagger .*<\(.*\)>.*/\1/p'
        done < "$VF_OUTGOING_TIPS"
      )
      [ "$bad" -eq 0 ] || { echo "fix the commit identity (git commit --amend --reset-author), or add a pattern if it is meant to be public"; exit 1; }
      echo "every outgoing identity is allowed"

  - id: leak-scan
    desc: no private IPs, internal hostnames, UNC shares or home paths in what this push adds
    stage: push
    enforce: false
    enforce_after: 2026-12-31
    why: |
      Internal topology is not a credential, so no secret scanner reports it:
      an RFC 1918 or CGNAT address, a host under .lan/.internal/.corp/
      .intranet/.localdomain/.home.arpa/.local, a \\server\share path, or a
      C:\Users\<name> or /home/<name> path that names a real account. Each is a
      map of where the code came from. Only ADDED lines of outgoing commits,
      their merge resolutions and their messages are read. Documentation should
      use the RFC 5737 ranges (192.0.2/24, 198.51.100/24, 203.0.113/24) and
      example.com names, which never match. Suppress a reviewed line by adding
      an extended regex for "path:line" to .vibeforge/leak-allow. Ships in
      shadow mode: tune the allow file against real pushes, then promote.
    run: |
      w="$(mktemp -d)"; trap 'rm -rf "$w"' EXIT
      [ -s "$VF_OUTGOING" ] || { echo "no outgoing commits"; exit 0; }
      md=--remerge-diff
      git show --remerge-diff -s --format= HEAD >/dev/null 2>&1 || md=--cc
      while read -r c; do
        git show -p -U0 --no-color --no-ext-diff --format='%n=== %H%n%B' "$c" \
          | awk '/^=== /{f="(message)"; next} /^diff --/{f="(diff)"; next}
                 /^\+\+\+ /{sub(/^\+\+\+ (b\/)?/,""); f=$0; next}
                 f=="(message)"{print "(message):" $0; next} /^\+/{print f ":" substr($0,2)}'
        if [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 2 ]; then
          git show "$md" -p --no-color --format= "$c" \
            | awk '/^\+\+\+ /{sub(/^\+\+\+ (b\/)?/,""); f=$0; next} /^\+/{print f " (merge):" substr($0,2)}'
        fi
      done < "$VF_OUTGOING" > "$w/added"
      ip='(^|[^0-9.])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9.]|$)'
      host='(^|[^A-Za-z0-9.-])[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.(lan|internal|intranet|corp|localdomain|home\.arpa|local)([^A-Za-z0-9.(-]|$)'
      unc='\\\\[A-Za-z][A-Za-z0-9._-]{2,}\\[A-Za-z0-9$._-]{2,}'
      home='([A-Za-z]:\\{1,2}Users\\{1,2}|(^|[^A-Za-z0-9._-])/(home|Users)/)[A-Za-z0-9._-]{2,}'
      generic='host\.docker\.internal|cluster\.local|localhost\.localdomain|\\\\(server|localhost|wsl\$)\\|/(home|Users)/(user|username|runner|ubuntu|root|you|me|example|name)([^A-Za-z0-9._-]|$)|Users\\{1,2}([Uu]ser|[Uu]sername|USER|USERNAME|Public|Default|runneradmin)|(^|[^A-Za-z0-9_])(self|this|cls|obj|ctx|config|settings|super|threading|os|sys)\.(local|lan|internal|intranet|corp)'
      # strip the conventions every repo shares, then look for what is left
      sed -E "s#($generic)##g" "$w/added" | grep -E -e "$ip" -e "$host" -e "$unc" -e "$home" > "$w/hits" || true
      if [ -f .vibeforge/leak-allow ]; then
        grep -vE -f <(grep -vE '^[[:space:]]*(#|$)' .vibeforge/leak-allow) "$w/hits" > "$w/kept" || true
      else cp "$w/hits" "$w/kept"; fi
      if [ -s "$w/kept" ]; then
        cut -c1-200 "$w/kept" | sed 's/^/   /'
        echo "internal details in lines this push adds: replace them, or allow a reviewed line in .vibeforge/leak-allow"
        exit 1
      fi
      echo "no internal addresses, hostnames, shares or home paths in $(wc -l < "$VF_OUTGOING" | tr -d ' ') outgoing commit(s)"

  - id: denylist-scan
    desc: no employer, client or codename terms in what this push adds
    stage: push
    probe: f="${VF_LEAK_DENYLIST:-$HOME/.config/vibeforge/leak-denylist}"; test -s "$f" || test -n "${VF_LEAK_DENYLIST_PATTERNS:-}"
    install: "create ~/.config/vibeforge/leak-denylist (one extended regex per line; NEVER inside the repo), or export VF_LEAK_DENYLIST_PATTERNS"
    why: |
      The names you must not publish — an employer, its clients, internal
      product codenames — cannot live in the repository, because committing
      the list publishes the names. So the list lives outside it: a file at
      ~/.config/vibeforge/leak-denylist (or $VF_LEAK_DENYLIST), or a
      newline-separated $VF_LEAK_DENYLIST_PATTERNS for environments that hold
      secrets in variables. The check refuses a list inside the repository.
      With no list configured the check SKIPs and blocks: a deny list nobody
      wrote is a gap you should see, not a pass. Reads added lines, merge
      resolutions, messages, and the names of the refs being pushed.
    run: |
      w="$(mktemp -d)"; trap 'rm -rf "$w"' EXIT
      f="${VF_LEAK_DENYLIST:-$HOME/.config/vibeforge/leak-denylist}"
      { [ -s "$f" ] && cat "$f"; printf '%s\n' "${VF_LEAK_DENYLIST_PATTERNS:-}"; } \
        | grep -vE '^[[:space:]]*(#|$)' > "$w/deny" || true
      if [ -s "$f" ]; then
        case "$(cd "$(dirname "$f")" && pwd -P)/" in "$(cd "$VF_ROOT" && pwd -P)"/*)
          echo "the deny list $f is inside the repository: move it out (publishing the repo would publish it)"; exit 1 ;;
        esac
      fi
      [ -s "$w/deny" ] || { echo "deny list is empty"; exit 1; }
      md=--remerge-diff
      git show --remerge-diff -s --format= HEAD >/dev/null 2>&1 || md=--cc
      while read -r c; do
        git show -p -U0 --no-color --no-ext-diff --format='(message) %B' "$c" | grep -E '^(\+|\(message\))' || true
        if [ "$(git rev-list --parents -n 1 "$c" | wc -w)" -gt 2 ]; then
          git show "$md" -p --no-color --format= "$c" | grep '^+' || true
        fi
      done < "$VF_OUTGOING" > "$w/added"
      if [ -n "${VF_PUSH_UPDATES:-}" ] && [ -r "$VF_PUSH_UPDATES" ]; then
        awk '{print "(ref) " $1 " " $3}' "$VF_PUSH_UPDATES" >> "$w/added"
      fi
      if grep -inE -f "$w/deny" "$w/added" > "$w/hits"; then
        echo "$(wc -l < "$w/hits" | tr -d ' ') added line(s) match the private deny list (terms are not printed: gate output can land in shared logs)"
        echo "see them locally: git rev-list HEAD --not --remotes | while read -r c; do git show -p \"\$c\"; done | grep -inE -f <your deny list>"
        exit 1
      fi
      echo "no deny-list terms in $(wc -l < "$VF_OUTGOING" | tr -d ' ') outgoing commit(s)"

  # --- static analysis (SAST) ------------------------------------------------

  - id: sast
    desc: static analysis for security-relevant patterns
    stage: push
    tool: semgrep
    install: "pipx install semgrep  (or: pip install semgrep)"
    why: |
      The code-scanning equivalent. The `p/ci` ruleset is the maintained OSS
      baseline and runs offline once the rules are cached. Start with
      `enforce: false` on an existing codebase — a SAST tool introduced in
      blocking mode on day one is a tool that gets removed by Friday.
    run: |
      "$VF_TOOL" --config p/ci --error --quiet --metrics=off .

  # --- dependency vulnerabilities -------------------------------------------

  - id: vuln-scan
    desc: no known-vulnerable dependencies
    stage: push
    tool: osv-scanner
    tool_version: "1.9.2"
    install: "go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2"
    why: |
      The dependency-review equivalent, and the broadest single win for a mixed
      repo: it reads lockfiles across most ecosystems, so one check covers Go,
      npm, PyPI, Cargo and more. Runs against the lockfile, so it sees the
      transitive versions actually resolved rather than declared ranges.
    run: |
      "$VF_TOOL" --recursive --skip-git "$VF_ROOT"

  # Language-native alternatives — narrower, but no extra tool to install.
  #
  # - id: vuln-go
  #   desc: no known-vulnerable Go dependencies
  #   stage: push
  #   dir: .
  #   tool: govulncheck
  #   install: "go install golang.org/x/vuln/cmd/govulncheck@latest"
  #   why: |
  #     Narrower than a lockfile scanner in a useful way — it reports only
  #     vulnerabilities in code paths your binary actually reaches, so its
  #     findings are almost all actionable.
  #   run: '"$VF_TOOL" ./...'
  #
  # - id: vuln-python
  #   desc: no known-vulnerable Python dependencies
  #   stage: push
  #   needs: pip-audit
  #   install: "pipx install pip-audit"
  #   run: pip-audit --strict
  #
  # - id: vuln-rust
  #   desc: no known-vulnerable crates
  #   stage: push
  #   needs: cargo-audit
  #   install: "cargo install cargo-audit --locked"
  #   run: cargo audit
  #
  # - id: vuln-node
  #   desc: no known-vulnerable npm dependencies
  #   stage: push
  #   why: |
  #     `npm audit` exits non-zero for advisories at or above the threshold.
  #     Pick a threshold you will actually hold to; `--audit-level=high` that
  #     everyone overrides is worse than `critical` that stops people.
  #   run: npm audit --audit-level=high

  # --- license policy --------------------------------------------------------

  - id: licenses
    desc: dependency licenses stay inside policy
    stage: push
    tool: go-licenses
    tool_version: "1.6.0"
    version_cmd: go version -m "$(command -v go-licenses)"
    install: "go install github.com/google/go-licenses@v1.6.0"
    why: |
      A copyleft dependency arriving transitively is a legal problem found late
      and expensively; the cheap moment to check is when it enters. The
      paid-tier name for this is "license compliance" — the capability is a
      tree walk over metadata your package manager already has.
      Go shown here (the version_cmd reads the pin out of the binary's own
      build info, since go-licenses has no --version). For other stacks swap
      the tool: license-checker (npm), pip-licenses (Python), cargo-deny
      (Rust) — same shape, same policy line.
    run: |
      "$VF_TOOL" check ./... --disallowed_types=forbidden,restricted

  # --- SBOM ------------------------------------------------------------------

  - id: sbom
    desc: the committed SBOM still describes the tree
    stage: push
    tool: syft
    tool_version: "1.18.1"
    version_cmd: syft version
    install: "curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b ~/.local/bin v1.18.1"
    fetch_sha256: "3aa0fd1c2479f8976122802422480e45dd6c814a693da4f550b4d39af14f8cae"
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 120 \
        "https://github.com/anchore/syft/releases/download/v${VF_TOOL_VERSION}/syft_${VF_TOOL_VERSION}_linux_amd64.tar.gz" \
        -o "$d/syft.tgz"
      tar xzf "$d/syft.tgz" -C "$d" syft
      mv "$d/syft" "$VF_TOOL_DEST"
      rm -rf "$d"
    why: |
      Increasingly a procurement requirement, and a paid-tier feature at every
      hosted forge. A committed-but-stale SBOM is worse than none — it
      documents a dependency set you no longer ship. So the check regenerates
      with the pinned syft and diffs against the committed copy, volatile
      lines (timestamp, document UUID) stripped; the version pin is what makes
      that diff meaningful.
      First run: no sbom.spdx exists yet — the check writes one and fails
      once, telling you to review and commit it.
    run: |
      out="$(mktemp)"
      "$VF_TOOL" scan "dir:$VF_ROOT" -q -o spdx-tag-value \
        | grep -vE '^(Created|DocumentNamespace|LicenseListVersion):' > "$out"
      if [ ! -f "$VF_ROOT/sbom.spdx" ]; then
        cp "$out" "$VF_ROOT/sbom.spdx"
        echo "no sbom.spdx was committed — wrote one; review it and commit"
        exit 1
      fi
      diff -u "$VF_ROOT/sbom.spdx" "$out" \
        || { echo "sbom.spdx is stale — review the diff, regenerate, commit"; exit 1; }
      echo "sbom.spdx matches the tree"
