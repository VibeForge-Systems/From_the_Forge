# =============================================================================
# Catalog — stack-independent checks
# =============================================================================
# These work in any repository because they check git and the tree itself
# rather than a language toolchain. Several replace a hosted gate that read the
# forge's API — done locally they need no account, no token, and no network.
# =============================================================================

checks:

  # --- commit metadata -------------------------------------------------------

  - id: dco
    desc: every non-merge, non-bot commit ahead of the base is signed off
    stage: push
    why: |
      A project that may need to relicense, donate, or accept an external
      contribution needs inbound=outbound terms over every commit. That right is
      permanently lost the moment one contribution merges without it —
      recovering it needs unanimous consent from every past contributor.
      Sign-off is the contributor certifying those terms.
      The hosted version of this check read PR commit metadata through the forge
      API. The local analogue is the commits on this branch that are not yet on
      the base, which is the same set in normal use.
    run: |
      base_ref=main
      git rev-parse --verify --quiet origin/main >/dev/null 2>&1 && base_ref=origin/main || true
      base="$(git merge-base HEAD "$base_ref" 2>/dev/null || true)"
      if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
        echo "dco: no commits ahead of $base_ref to check"
        exit 0
      fi
      bad=0
      while read -r sha; do
        [ -z "$sha" ] && continue
        author="$(git show -s --format='%an' "$sha")"
        case "$author" in *'[bot]') continue ;; esac
        if ! git show -s --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
          printf '   missing Signed-off-by: %s  %s\n' "${sha:0:8}" "$(git show -s --format='%s' "$sha")"
          bad=1
        fi
      done < <(git rev-list --no-merges "$base..HEAD")
      if [ "$bad" -ne 0 ]; then
        echo "fix with 'git commit -s' or 'git rebase --signoff $base_ref'"
        exit 1
      fi
      echo "dco: every commit in $base_ref..HEAD is signed off"

  - id: commit-subjects
    desc: commit subjects are well-formed
    stage: push
    enforce: false
    why: |
      Readable history is worth something, but this is style — it ships
      advisory. Promote it to blocking only if the team agrees the convention
      is a rule.
    run: |
      base_ref=main
      git rev-parse --verify --quiet origin/main >/dev/null 2>&1 && base_ref=origin/main || true
      base="$(git merge-base HEAD "$base_ref" 2>/dev/null || true)"
      [ -n "$base" ] || exit 0
      bad=0
      while read -r line; do
        [ -z "$line" ] && continue
        sha="${line%% *}"; subject="${line#* }"
        if [ "${#subject}" -gt 72 ]; then
          printf '   subject over 72 chars: %s  %s\n' "${sha:0:8}" "$subject"; bad=1
        fi
        case "$subject" in
          *.) printf '   subject ends with a period: %s\n' "${sha:0:8}"; bad=1 ;;
        esac
      done < <(git log --no-merges --format='%H %s' "$base..HEAD")
      [ "$bad" -eq 0 ] || exit 1
      echo "commit subjects: ok"

  # --- tree hygiene ----------------------------------------------------------

  - id: no-merge-markers
    desc: no unresolved conflict markers
    stage: commit
    why: |
      A committed conflict marker usually still compiles in a config file or a
      document, so nothing else catches it. One grep, effectively free.
    run: |
      if git grep -nE '^(<<<<<<<|>>>>>>>) ' -- . ; then
        echo "unresolved merge conflict markers above"
        exit 1
      fi
      echo "no conflict markers"

  - id: no-large-files
    desc: no oversized files added to git
    stage: push
    why: |
      A large binary in history is effectively permanent — every clone pays for
      it forever, and removing it means rewriting history. The moment it is
      added is the only cheap moment to catch it.
    run: |
      limit=$((5 * 1024 * 1024))
      bad=0
      while read -r f; do
        [ -f "$f" ] || continue
        size=$(wc -c < "$f")
        if [ "$size" -gt "$limit" ]; then
          printf '   %s is %s bytes (limit %s)\n' "$f" "$size" "$limit"; bad=1
        fi
      done < <(git ls-files)
      [ "$bad" -eq 0 ] || { echo "use git-lfs or keep these out of the repo"; exit 1; }
      echo "no oversized tracked files"

  - id: no-trailing-whitespace
    desc: no trailing whitespace in tracked text files
    stage: commit
    enforce: false
    run: |
      if git grep -nI ' $' -- . ; then
        echo "trailing whitespace above"
        exit 1
      fi
      echo "no trailing whitespace"

  - id: line-endings
    desc: no CRLF line endings in tracked text files
    stage: commit
    why: |
      The gate's own honest limit is that it runs on one OS — structural
      checks that catch other-OS breakage are the cheap fraction of the matrix
      you do not have. CRLF is the classic case: a shell script with CRLF
      fails with an error naming the wrong problem entirely.
    run: |
      if git grep -Il $'\r' -- . ; then
        echo "CRLF line endings in the files above (add '* text=auto' to .gitattributes)"
        exit 1
      fi
      echo "no CRLF line endings"

  - id: config-parses
    desc: every tracked JSON and TOML file parses
    stage: commit
    probe: python3 -c "import json, tomllib"
    install: "python3 >= 3.11 (tomllib joined the stdlib at 3.11)"
    why: |
      A config file with a syntax error fails at the moment something reads
      it, which is usually deploy time. Parsing is free and the stdlib does
      it — nothing to install. YAML needs a third-party module; if the repo
      leans on YAML, add `import yaml` to the probe and a loader to the loop.
    run: |
      python3 - <<'EOF'
      import json, subprocess, sys, tomllib
      files = subprocess.run(["git", "ls-files", "*.json", "*.toml"],
                             capture_output=True, text=True).stdout.split()
      bad = 0
      for f in files:
          try:
              raw = open(f, "rb").read()
              json.loads(raw) if f.endswith(".json") else tomllib.loads(raw.decode())
          except Exception as e:
              print(f"  {f}: {e}")
              bad = 1
      if bad:
          sys.exit(1)
      print(f"{len(files)} config files parse")
      EOF

  - id: typos
    desc: no misspellings in sources and docs
    stage: commit
    enforce: false
    enforce_after: 2026-11-01
    tool: typos
    tool_version: "1.28.4"
    install: "cargo install typos-cli --locked --version 1.28.4"
    fetch_sha256: "d4a156680059614551bb56db862b5ce102873368b7a4a8c6140bbc51b382be3e"
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/crate-ci/typos/releases/download/v${VF_TOOL_VERSION}/typos-v${VF_TOOL_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
        -o "$d/typos.tgz"
      tar xzf "$d/typos.tgz" -C "$d" ./typos
      mv "$d/typos" "$VF_TOOL_DEST"
      rm -rf "$d"
    why: |
      Milliseconds fast, and misspellings in identifiers become API surface.
      Every codebase carries a private dictionary of intentional oddities,
      so this is the worked example of shadow mode with a deadline: it ships
      advisory, you tune _typos.toml against real runs, and enforce_after
      promotes it on the date instead of relying on anyone remembering.
      Set the date when you copy the block.
    run: |
      "$VF_TOOL" .

  # --- the gate's own integrity ----------------------------------------------

  - id: gate-manifest-parses
    desc: the manifest itself is valid
    stage: commit
    why: |
      A manifest that stops parsing takes the whole gate with it — and the
      failure would otherwise surface at the least convenient moment, mid-push.
      `--list` parses and validates without running anything.
    run: |
      "$VF_ROOT/.vibeforge/gate.sh" --list > /dev/null
      echo "manifest parses"

  - id: shell-syntax
    desc: shell scripts parse
    stage: commit
    why: |
      `bash -n` is a syntax check with no dependency to install — worth having
      even in a repo that also runs shellcheck.
    run: |
      bad=0
      while read -r f; do
        [ -f "$f" ] || continue
        bash -n "$f" || bad=1
      done < <(git ls-files '*.sh' '*/hooks/*')
      [ "$bad" -eq 0 ] || exit 1
      echo "shell scripts parse"

  - id: shellcheck
    desc: shellcheck is clean
    stage: push
    needs: shellcheck
    install: "apt install shellcheck  /  brew install shellcheck"
    run: |
      mapfile -t files < <(git ls-files '*.sh')
      [ "${#files[@]}" -eq 0 ] && { echo "no shell scripts"; exit 0; }
      shellcheck -S warning "${files[@]}"

  # --- coexisting with hosted CI ---------------------------------------------

  - id: workflow-lint
    desc: hosted-CI workflow files are valid
    stage: commit
    tool: actionlint
    tool_version: "1.7.4"
    install: "go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.4"
    fetch_sha256: "39cae525cdb54af5d91dcf27f55e040d37ecea01dd4153490c4dc84f5d251d46"
    fetch: |
      d="$(mktemp -d)"
      curl -fsSL --max-time 90 \
        "https://github.com/rhysd/actionlint/releases/download/v${VF_TOOL_VERSION}/actionlint_${VF_TOOL_VERSION}_linux_amd64.tar.gz" \
        -o "$d/al.tgz"
      tar xzf "$d/al.tgz" -C "$d" actionlint
      mv "$d/actionlint" "$VF_TOOL_DEST"
      rm -rf "$d"
    why: |
      For the transition period when the local gate and a hosted config
      coexist: a broken workflow file otherwise fails only inside the
      vendor's runner, the one place you cannot debug it. This is for keeping
      hosted config that exists honest — not for authoring new hosted config.
      Drop the check when the last workflow file goes.
    run: |
      ls .github/workflows/*.yml .github/workflows/*.yaml >/dev/null 2>&1 \
        || { echo "no workflow files"; exit 0; }
      "$VF_TOOL"
